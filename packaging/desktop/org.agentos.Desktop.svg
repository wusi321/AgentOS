<?xml version="1.0" encoding="UTF-8"?>
<!--
  AgentOS application icon.

  Drawn as a simple symbolic-friendly glyph: a terminal prompt inside a rounded
  square, using "currentColor" so the desktop theme supplies the colour. A
  hardcoded brand colour would be illegible in one of the light or dark themes.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none">
  <title>AgentOS</title>
  <rect x="8" y="8" width="112" height="112" rx="24" ry="24"
        fill="none" stroke="currentColor" stroke-width="8"/>
  <path d="M38 46 L58 64 L38 82" fill="none" stroke="currentColor"
        stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M68 84 L92 84" fill="none" stroke="currentColor"
        stroke-width="10" stroke-linecap="round"/>
</svg>
