<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System bus policy for the AgentOS core service.

  The policy is written as "deny by default, then grant the single thing the
  service needs". A D-Bus policy that grants broadly is a second, silent
  authorization path around the AgentOS policy engine, so the service owns
  exactly one name and nothing else.
-->
<busconfig>

  <!-- The service account may own only its own well-known names. -->
  <policy user="agentos">
    <allow own="org.agentos.Core1"/>
    <allow send_destination="org.freedesktop.systemd1"/>
    <allow receive_sender="org.freedesktop.systemd1"/>
    <allow send_destination="org.freedesktop.login1"/>
    <allow receive_sender="org.freedesktop.login1"/>
  </policy>

  <!--
    Any local user may talk to the core service. Authorization is not delegated
    to D-Bus: the service authenticates every request with SO_PEERCRED on its own
    Unix socket, which is the only IPC endpoint it opens. This stanza exists so
    that a future D-Bus front end cannot be added without revisiting the policy.
  -->
  <policy context="default">
    <allow send_destination="org.agentos.Core1"/>
    <deny own="org.agentos.Core1"/>
  </policy>

</busconfig>
